name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Creer le projet et compiler
        run: |
          mkdir -p P && cd P
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LorisSearch"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.loris.search"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.loris.search"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Permet d'ouvrir des liens http(s) avec Loris Search -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Loris Search</string>
          </resources>
          EOF
          mkdir -p $(dirname app/src/main/res/layout/activity_main.xml)
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:fitsSystemWindows="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="6dp">

                  <EditText
                      android:id="@+id/urlBar"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:hint="Rechercher ou saisir une adresse"
                      android:imeOptions="actionGo"
                      android:inputType="textUri"
                      android:maxLines="1"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:selectAllOnFocus="true" />

                  <ImageButton
                      android:id="@+id/btnReload"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:contentDescription="Actualiser"
                      android:src="@android:drawable/ic_menu_rotate" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:visibility="gone" />

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="4dp">

                  <ImageButton
                      android:id="@+id/btnBack"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?attr/selectableItemBackground"
                      android:contentDescription="Précédent"
                      android:src="@android:drawable/ic_media_previous" />

                  <ImageButton
                      android:id="@+id/btnForward"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?attr/selectableItemBackground"
                      android:contentDescription="Suivant"
                      android:src="@android:drawable/ic_media_next" />

                  <ImageButton
                      android:id="@+id/btnHome"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:background="?attr/selectableItemBackground"
                      android:contentDescription="Accueil"
                      android:src="@android:drawable/ic_menu_myplaces" />
              </LinearLayout>
          </LinearLayout>
          EOF
          mkdir -p $(dirname app/src/main/java/com/loris/search/MainActivity.kt)
          cat > app/src/main/java/com/loris/search/MainActivity.kt <<'EOF'
          package com.loris.search

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.ProgressBar
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var urlBar: EditText
              private lateinit var progress: ProgressBar

              // Moteur de recherche par défaut (modifiable)
              private val searchUrl = "https://duckduckgo.com/?q="
              private val homeUrl = "https://duckduckgo.com"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  urlBar = findViewById(R.id.urlBar)
                  progress = findViewById(R.id.progress)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      builtInZoomControls = true
                      displayZoomControls = false
                      loadWithOverviewMode = true
                      useWideViewPort = true
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean = false

                      override fun onPageStarted(view: WebView, url: String, favicon: Bitmap?) {
                          progress.visibility = View.VISIBLE
                          urlBar.setText(url)
                      }

                      override fun onPageFinished(view: WebView, url: String) {
                          progress.visibility = View.GONE
                          urlBar.setText(url)
                      }
                  }
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          progress.progress = newProgress
                      }
                  }

                  urlBar.setOnEditorActionListener { _, actionId, event ->
                      if (actionId == EditorInfo.IME_ACTION_GO ||
                          (event?.keyCode == KeyEvent.KEYCODE_ENTER && event.action == KeyEvent.ACTION_DOWN)
                      ) {
                          load(urlBar.text.toString())
                          hideKeyboard()
                          true
                      } else false
                  }

                  findViewById<ImageButton>(R.id.btnReload).setOnClickListener { webView.reload() }
                  findViewById<ImageButton>(R.id.btnBack).setOnClickListener { if (webView.canGoBack()) webView.goBack() }
                  findViewById<ImageButton>(R.id.btnForward).setOnClickListener { if (webView.canGoForward()) webView.goForward() }
                  findViewById<ImageButton>(R.id.btnHome).setOnClickListener { load(homeUrl) }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })

                  // Lien ouvert depuis une autre app, sinon page d'accueil
                  load(intent?.data?.toString() ?: homeUrl)
              }

              private fun load(input: String) {
                  val text = input.trim()
                  if (text.isEmpty()) return
                  val url = when {
                      text.startsWith("http://") || text.startsWith("https://") -> text
                      text.contains(".") && !text.contains(" ") -> "https://$text"
                      else -> searchUrl + Uri.encode(text)
                  }
                  webView.loadUrl(url)
              }

              private fun hideKeyboard() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(urlBar.windowToken, 0)
                  urlBar.clearFocus()
              }
          }
          EOF
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LorisSearch-apk
          path: P/app/build/outputs/apk/debug/app-debug.apk
